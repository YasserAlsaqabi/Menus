<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مسك · المنيو</title>
<style>
@font-face{font-family:Cairo;src:url(../fonts/Cairo-Variable.ttf) format("truetype");font-weight:200 1000;font-display:swap}
/* VOICE: دافي وبيتي، عينة قصيرة لمطعم أكلات مصرية
   IDEA: طبق كشري ينشاف من فوق
   PICTURE: صحن دائري فيه رز وعدس ومكرونة وصلصة وبصل مقرمش، يتوسط الرأس
   COLOUR and TYPE: فيروزي غامق غالب، برتقالي طماطم للزر؛ خط Cairo
   LAYOUT: عمود واحد للجوال، قسم واحد بأربعة أصناف، زر طلب واتساب ثابت */
:root{color-scheme:light dark;
--bg:light-dark(#fbf6f1,#1d1411);--card:light-dark(#ffffff,#2a1d18);--ink:light-dark(#2a1712,#f6ece6);
--mut:light-dark(#7a645b,#bfa99f);--main:#0f5e63;--main2:#083d41;--acc:#d9622b;--line:light-dark(#efe3da,#3a2a23)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Cairo,Tahoma,sans-serif;overflow-x:clip;padding-bottom:120px}
.wrap{max-width:520px;margin:0 auto}
header{background:radial-gradient(120% 90% at 50% 0%,var(--main),var(--main2));color:#fff;text-align:center;padding:30px 18px 0;position:relative}
.kicker{font-size:14px;font-weight:600;opacity:.85;margin:0}
header h1{margin:2px 0 0;font-size:44px;font-weight:800;line-height:1.05;letter-spacing:0}
.meta{margin:10px 0 0;font-size:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.meta span{background:rgba(255,255,255,.14);border-radius:99px;padding:3px 12px;font-weight:600}
.tray{display:block;width:250px;height:250px;margin:18px auto -110px;filter:drop-shadow(0 18px 22px rgba(60,15,5,.35));position:relative;z-index:1}
.note{background:#fff3c9;color:#5a4300;font-size:13px;text-align:center;padding:8px 14px;margin:126px 16px 0;border-radius:12px}
h2{font-size:22px;margin:22px 16px 4px;font-weight:800}
.lead{margin:0 16px 14px;color:var(--mut);font-size:15px}
.item{background:var(--card);margin:0 16px 10px;padding:14px;border-radius:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line)}
.item b{display:block;font-size:17px;line-height:1.3}
.item small{display:block;color:var(--mut);font-size:13px;line-height:1.45;margin-top:3px}
.tag{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-inline-start:4px;font-weight:600;vertical-align:middle}
.side{display:flex;gap:10px;align-items:center}
.price{font-weight:800;white-space:nowrap;font-size:16px}
.add{width:44px;height:44px;border-radius:12px;border:0;background:var(--acc);color:#fff;font:800 22px Cairo,sans-serif;cursor:pointer;position:relative}
.sub{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:800 22px Cairo,sans-serif;cursor:pointer}
.sub[hidden]{display:none}
.add .n{position:absolute;top:-6px;left:-6px;background:var(--main);color:#fff;border-radius:99px;font-size:12px;min-width:20px;height:20px;line-height:20px;padding:0 4px}
.add .n:empty{display:none}
.add:focus-visible,.sub:focus-visible,.cta a:focus-visible,.clr:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.foot{text-align:center;color:var(--mut);font-size:13px;padding:14px 16px}
.cta{position:fixed;inset-inline:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 94%,transparent);border-top:1px solid var(--line);z-index:3}
.sum{max-width:488px;margin:0 auto 6px;font-size:13px;color:var(--mut);display:flex;justify-content:space-between}
.clr{background:none;border:0;color:var(--main);font:600 13px Cairo,sans-serif;cursor:pointer;padding:0}
.cta a{display:flex;align-items:center;justify-content:center;gap:10px;max-width:488px;margin:0 auto;background:#1f9d55;color:#fff;text-decoration:none;font-weight:800;font-size:18px;padding:14px;border-radius:16px}
.cta svg{width:22px;height:22px}
@media (prefers-reduced-motion:no-preference){.steam{animation:rise 3s ease-in-out infinite}.steam:nth-of-type(2){animation-delay:1s}}
@keyframes rise{0%{opacity:0;transform:translateY(6px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-10px)}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <p class="kicker">أكلات مصرية، طعم البيت</p>
  <h1>مسك</h1>
  <div class="meta"><span>حي المنتزة، بريدة</span><span>★ 4.4 من 1443 تقييم</span></div>
  <svg class="tray" viewBox="0 0 250 250" aria-hidden="true">
    <defs>
      <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf7ef"/><stop offset=".5" stop-color="#d9cfbe"/><stop offset="1" stop-color="#f2ece1"/></linearGradient>
      <radialGradient id="base" cx="45%" cy="40%" r="60%"><stop offset="0" stop-color="#e9c98f"/><stop offset="1" stop-color="#c79a52"/></radialGradient>
      <radialGradient id="sauce" cx="45%" cy="40%" r="60%"><stop offset="0" stop-color="#e8573a"/><stop offset="1" stop-color="#a92e1c"/></radialGradient>
    </defs>
    <path class="steam" d="M105 22q-8 -10 0 -20" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" opacity=".6"/>
    <path class="steam" d="M145 22q8 -10 0 -20" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" opacity=".6"/>
    <circle cx="125" cy="128" r="112" fill="url(#rim)"/>
    <circle cx="125" cy="128" r="96" fill="url(#base)"/>
    <g fill="none" stroke="#f3dfb4" stroke-width="5" stroke-linecap="round">
      <path d="M62 112q8-6 14 2"/><path d="M178 150q8 4 6 12"/><path d="M80 170q6 6 14 4"/><path d="M170 92q6-6 14-2"/><path d="M150 186q8 0 12-6"/><path d="M70 140q4 8 12 8"/>
    </g>
    <g fill="#8a5a2b"><circle cx="72" cy="124" r="3"/><circle cx="182" cy="128" r="3"/><circle cx="100" cy="186" r="3"/><circle cx="160" cy="72" r="3"/><circle cx="88" cy="88" r="3"/><circle cx="190" cy="104" r="2.5"/></g>
    <path d="M85 128q0-40 40-42q42 2 42 42q-2 40-42 40q-40-2-40-40Z" fill="url(#sauce)"/>
    <g fill="#e0a44e"><path d="M104 104q10-4 16 4q-10 4-16-4Z"/><path d="M132 100q10 0 12 10q-10 0-12-10Z"/><path d="M110 140q8 6 4 14q-8-6-4-14Z"/><path d="M140 138q10 2 10 12q-10-2-10-12Z"/><path d="M120 122q10-2 14 6q-10 2-14-6Z"/><path d="M96 124q6 6 2 12q-6-6-2-12Z"/></g>
    <g fill="#7a3d14"><path d="M114 112q6-2 8 4q-6 2-8-4Z"/><path d="M142 124q6 0 6 6q-6 0-6-6Z"/><path d="M126 150q6-2 8 4q-6 2-8-4Z"/></g>
    <g fill="#fff3d6"><ellipse cx="100" cy="150" rx="5" ry="4"/><ellipse cx="150" cy="110" rx="5" ry="4"/></g>
    <ellipse cx="94" cy="76" rx="30" ry="8" fill="#fff" opacity=".22" transform="rotate(-25 94 76)"/>
  </svg>
</header>

<p class="note">عينة: الأصناف والأسعار أمثلة (نموذج)، وتتغيّر لأصنافكم وأسعاركم.</p>

<h2>أكلات مصرية</h2>
<p class="lead">تنطبخ يومياً، وتوصلكم حارة.</p>
<main id="menu"></main>
<p class="foot">اختر اللي تبيه، ويوصلنا طلبك على الواتساب</p>
</div>

<div class="cta">
  <div class="sum"><span id="sum">ما اخترت شي للحين</span><button class="clr" id="clr" type="button" hidden>مسح الطلب</button></div>
  <a id="wa" href="https://wa.me/966506136605">
    <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.2.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.5-.3Z"/></svg>
    <span id="waTxt">اطلب على الواتساب</span>
  </a>
</div>

<script>
{
const PHONE='966506136605';
const ITEMS=[
 {n:'كشري',d:'صحن وسط، بالصلصة والدقة',p:18},
 {n:'محشي مشكل',d:'كوسا وباذنجان وورق عنب',p:35},
 {n:'ملوخية بالدجاج',d:'مع رز أبيض',p:32},
 {n:'حواوشي',d:'رغيف بلدي محشي لحمة',p:20}
];
const cart={};
const menu=document.getElementById('menu');
menu.innerHTML=ITEMS.map((it,i)=>`<div class="item">
 <div><b>${it.n} <span class="tag">نموذج</span></b><small>${it.d}</small></div>
 <div class="side"><span class="price">${it.p} ر.س</span><button class="sub" type="button" data-k="${i}" aria-label="نقّص ${it.n}" hidden>−</button><button class="add" type="button" data-k="${i}" aria-label="أضف ${it.n}">+<span class="n"></span></button></div></div>`).join('');
function render(){
  let count=0,total=0,lines=[];
  for(const k in cart){const it=ITEMS[k],q=cart[k];count+=q;total+=q*it.p;lines.push(`${q} × ${it.n}`);}
  document.querySelectorAll('.add').forEach(b=>b.querySelector('.n').textContent=cart[b.dataset.k]||'');
  document.querySelectorAll('.sub').forEach(b=>b.hidden=!cart[b.dataset.k]);
  document.getElementById('sum').textContent=count?`${count} صنف · ${total} ر.س (نموذج)`:'ما اخترت شي للحين';
  document.getElementById('clr').hidden=!count;
  document.getElementById('waTxt').textContent=count?'أرسل الطلب على الواتساب':'اطلب على الواتساب';
  const msg=count?`السلام عليكم، أبي أطلب من مطعم مسك:\n${lines.join('\n')}\nالمجموع: ${total} ر.س`:'السلام عليكم، أبي أطلب من مطعم مسك';
  document.getElementById('wa').href=`https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`;
}
menu.addEventListener('click',e=>{
  const a=e.target.closest('.add'),m=e.target.closest('.sub');
  if(a){cart[a.dataset.k]=(cart[a.dataset.k]||0)+1;render();}
  else if(m&&cart[m.dataset.k]){if(--cart[m.dataset.k]<=0)delete cart[m.dataset.k];render();}
});
document.getElementById('clr').addEventListener('click',()=>{for(const k in cart)delete cart[k];render();});
render();
}
</script>
</body>
</html>
